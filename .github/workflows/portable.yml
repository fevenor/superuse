name: portable-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.12
      - run: uv sync --locked --extra app --extra packaging --dev
      - run: uv run --locked python scripts/check_design.py
      - run: uv run --locked python scripts/check_publication.py --staged
      - run: uv run --locked --extra app --extra packaging python scripts/build_portable.py
      - run: uv run --locked --extra app --extra packaging pytest tests/integration/test_portable_package.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: Superuse-windows-x64-portable
          path: |
            dist/Superuse-*-windows-x64-portable.zip
            dist/Superuse-*-windows-x64-portable.zip.sha256
          if-no-files-found: error
