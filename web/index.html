<!DOCTYPE html>
<html lang="zh-CN">
<!--
  Superuse human interface, adapted from the upstream serial-hid-kvm viewer
  (MIT, see web/vendor/upstream-viewer.html) per third_party/CHANGES.md:
  session/bootstrap auth, lease-aware takeover/handback, ordered input stream,
  state-machine driven status, binary video framing with metadata headers.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16213e">
<title>Superuse</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="toolbar">
  <button id="btnTakeover" title="接管控制（走释放屏障）">接管</button>
  <button id="btnHandback" title="交还控制给 agent" disabled>交还</button>
  <button id="btnCad" title="向目标发送 Ctrl+Alt+Del">Ctrl+Alt+Del</button>
  <button id="btnAltTab" title="向目标发送 Alt+Tab">Alt+Tab</button>
  <button id="btnCursor" title="切换本地光标">光标</button>
  <select id="mouseMode" aria-label="鼠标模式" title="绝对坐标（默认，单屏目标）；相对模式：接管后点击画面捕获鼠标，Esc 退出（移动设备/多屏）">
    <option value="absolute" selected>绝对坐标</option>
    <option value="relative">相对移动</option>
  </select>
  <button id="btnDeviceMode" title="设备端持久化的鼠标坐标模式；点击在绝对/相对之间切换（运行时生效，约 1 秒，仅本机页面）" hidden>设备鼠标:--</button>
  <button id="btnDeviceRestart" title="重启 SuperKVM 设备（同厂商 WebApp 的“重启 KVM”）；期间串口/视频短暂断开，租约回收，仅本机页面" hidden>重启设备</button>
  <button id="btnScale" title="切换 1:1 / 适应">1:1</button>
  <button id="btnFs" title="全屏">全屏</button>
  <button id="btnLogout" title="退出局域网登录" hidden>退出登录</button>
  <span id="status">连接中…</span>
  <span id="fps"></span>
</div>
<div id="container"><canvas id="screen" tabindex="0"></canvas>
  <div id="overlay" hidden>
    <div id="overlayTitle">视频未就绪</div>
    <div id="overlayDetail"></div>
  </div>
  <div id="login" hidden>
    <form id="loginForm">
      <div id="loginTitle">Superuse 局域网访问</div>
      <input id="loginKey" type="password" autocomplete="off" placeholder="访问密钥"
             aria-label="访问密钥" autofocus>
      <button type="submit" id="loginSubmit">登录</button>
      <div id="loginError"></div>
    </form>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
