schema_version = 1

[device]
# Real hardware is the default: the app waits for the SuperKVM device and
# recovers when it is plugged in. "simulated" is a development/test-only
# mode and is rejected by the packaged release builds.
mode = "real"

[device.serial]
vid = 0x1209
pid = 0x0001
serial_number = ""
baud = 2000000
read_timeout_ms = 100
write_timeout_ms = 250

[device.video]
vid = 0x345f
pid = 0x2131
name = "SK USB3 Video"
device_path = ""
backend = "dshow"
width = 1920
height = 1080
requested_fps = 30
autocrop = false

[server]
host = "127.0.0.1"
port = 0

[network]
# Trusted-LAN access (task 2026-10-17). The key is shared by remote browsers
# and HTTP MCP agents; any non-empty string works ("a", "123" included) and
# is compared exactly as written — no trimming or case folding. Empty key =
# network access stays off. Changes apply after a restart; the LAN switch
# itself lives in the tray menu.
key = ""
web_port = 18765          # remote browser HTTP/WS
mcp_port = 18766          # Streamable HTTP MCP at http://<host>:18766/mcp
lan_host = "0.0.0.0"      # or one local IPv4 address to bind a single NIC

[control]
lease_ttl_ms = 15000
renew_interval_ms = 5000
agent_idle_ms = 60000
input_queue_limit = 128
action_timeout_ms = 30000
fence_timeout_ms = 2000

[video]
publish_fps = 10
jpeg_quality = 80
snapshot_max_width = 1280
freshness_ms = 1000
stall_timeout_ms = 2000

[logging]
level = "INFO"
max_bytes = 5242880
backup_count = 5
capture_enabled = false
